name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          ABB6BD: ${{ secrets.ABB6BD }}
          BCF908: ${{ secrets.BCF908 }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('ABB6BD', '')
          sec_b = os.environ.get('BCF908', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- c1097c2f454de03d9e343bf58e -->', sec_a)
          if sec_b:
              after = after.replace('<!-- 73d10635a703c0e0533419e6e8 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
